<!doctype html>
<html>
  <head>
    <title>Business Rules</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fb;
      }

      .card-box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>

  <body>
    <div class="container mt-5">
      <div class="card-box">
        <h2 class="mb-4">Business Rules</h2>

        {% if rule %}
        <div>{{ rule.content|linebreaks }}</div>
        {% else %}
        <p>No business rules have been added yet.</p>
        {% endif %}
      </div>
    </div>
  </body>
</html>
