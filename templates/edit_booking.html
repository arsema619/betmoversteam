{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Booking</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <div class="container mt-5">
      <div class="card-box">
        <h2 class="mb-4">Edit Booking</h2>

        <form method="POST">
          {% csrf_token %}

          <!-- CUSTOMER NAME -->
          <div class="mb-3">
            <label class="form-label"> Customer Name </label>

            <input
              type="text"
              name="customer_name"
              class="form-control"
              value="{{ booking.customer_name }}"
              required
            />
          </div>

          <!-- PHONE -->
          <div class="mb-3">
            <label class="form-label"> Phone </label>

            <input
              type="text"
              name="phone"
              class="form-control"
              value="{{ booking.phone }}"
              required
            />
          </div>

          <!-- FROM LOCATION -->
          <div class="mb-3">
            <label class="form-label"> From Location </label>

            <input
              type="text"
              name="from_location"
              class="form-control"
              value="{{ booking.from_location }}"
              required
            />
          </div>

          <!-- TO LOCATION -->
          <div class="mb-3">
            <label class="form-label"> To Location </label>

            <input
              type="text"
              name="to_location"
              class="form-control"
              value="{{ booking.to_location }}"
              required
            />
          </div>

          <!-- TOTAL PRICE -->
          <div class="mb-3">
            <label class="form-label"> Total Price </label>

            <input
              type="number"
              name="total_price"
              class="form-control"
              value="{{ booking.total_price }}"
              required
            />
          </div>

          <!-- ADVANCE -->
          <div class="mb-3">
            <label class="form-label"> Advance </label>

            <input
              type="number"
              name="advance"
              class="form-control"
              value="{{ booking.advance }}"
              required
            />
          </div>

          <!-- BALANCE -->
          <div class="mb-3">
            <label class="form-label"> Balance </label>

            <input
              type="number"
              name="balance"
              class="form-control"
              value="{{ booking.balance }}"
              required
            />
          </div>

          <label>Extra</label>

          <input
            type="number"
            name="extra"
            value="{{ booking.extra }}"
            class="form-control"
          />

          <!-- DATE -->
          <div class="mb-3">
            <label class="form-label"> Date </label>

            <input
              type="date"
              name="date"
              class="form-control"
              value="{{ booking.date|date:'Y-m-d' }}"
              required
            />
          </div>

          <!-- STATUS -->

          <!-- STATUS -->
          <div class="mb-3">
            <label class="form-label"> Status </label>

            <select name="status" class="form-control">
              <option
                value="Pending"
                {%
                if
                booking.status=""
                ="Pending"
                %}
                selected
                {%
                endif
                %}
              >
                Pending
              </option>

              <option
                value="Completed"
                {%
                if
                booking.status=""
                ="Completed"
                %}
                selected
                {%
                endif
                %}
              >
                Completed
              </option>
            </select>
          </div>

          <!-- BUTTONS -->
          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary">
              Update Booking
            </button>

            <a href="/" class="btn btn-secondary"> Cancel </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
