{% load static %}
<!doctype html>
<html>
  <head>
    <title>Add Booking</title>
    
    <style>
    body{

    background:#f4f7fb;
    font-family:Arial;
}

.main-box{

    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0px 4px 20px rgba(0,0,0,0.08);
}

h2{

    font-weight:bold;
    color:#111827;
}

.table{

    border-radius:18px;
    overflow:hidden;
    background:white;
}

.table thead{

    background:#111827;
    color:white;
}

.table th{

    padding:18px;
    font-size:15px;
}

.table td{

    padding:18px;
    vertical-align:middle;
    font-size:15px;
    font-weight:500;
}

.table tbody tr{

    transition:0.3s;
}

.table tbody tr:hover{

    background:#f3f4f6;
}

.badge{

    padding:10px 15px;
    border-radius:10px;
    font-size:13px;
}

.btn-edit{

    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.btn-edit:hover{

    background:#1d4ed8;
    color:white;
}
</style>
  

  <body>
    <div class="main">
      <h2>Add Booking</h2>

      <form method="POST">
        {% csrf_token %}

        <input
          type="text"
          name="customer_name"
          placeholder="Customer Name"
        /><br /><br />
        <input type="text" 
        name="phone" 
        placeholder="Phone" 
         autocomplete="off"/>
         <br /><br />

        <input
          type="text"
          name="from_location"
          placeholder="From"
        /><br /><br />
        <input type="text" name="to_location" placeholder="To" /><br /><br />

        
  


           <select name="office_phone" class="form-control mb-3">

    <option value="0979666611">
        0979666611
    </option>

    <option value="0978666611">
        0978666611
    </option>

    

    <div class="mb-3">

    <label>Status</label>

    <input
        type="text"
        class="form-control"
        value="Pending"
        readonly
    >

</div>
        


</select>

        <input
          type="number"
          name="total_price"
          placeholder="Total Price"
        /><br /><br />


        <select name="time" class="form-control mb-3">

  <option value="Morning">Morning</option>

  <option value="Afternoon">Afternoon</option>

  <option value="Evening">Evening</option>

  </select>

        

        <input type="number" name="advance" placeholder="Advance" /><br /><br />
        
    
 

     <button type="submit">Save Booking</button>
      </form>
    </div>

    <script>

function calculateBalance() {

    let total =
        Number(document.getElementById("total_price").value) || 0;

    let extra =
        Number(document.getElementById("extra").value) || 0;

    let balance = total + extra;

    document.getElementById("balance").value = balance;
}

document.getElementById("total_price")
.addEventListener("input", calculateBalance);

document.getElementById("extra")
.addEventListener("input", calculateBalance);

</script>

  </body>
</html>
