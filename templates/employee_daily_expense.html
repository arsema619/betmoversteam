<!doctype html>
<html>
  <head>
    <title>Add Expense</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body style="background: #f5f7fb">
    <div class="container mt-5">
      <div class="card shadow p-4 border-0 rounded-4">
        <h2 class="mb-4">Add Expense</h2>

        <form method="POST">
          {% csrf_token %}

          <select name="booking" class="form-control mb-3">
            {% for booking in bookings %}
            <option value="{{ booking.id }}">
              Move {{ booking.id }} - {{ booking.customer_name }}
            </option>
            {% endfor %}
          </select>

          <input
            type="number"
            id="labor"
            name="labor"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Labor"
          />
          <input
            type="number"
            id="packers"
            name="packers"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Packers"
          />
          <input
            type="number"
            id="supervisor"
            name="supervisor"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Supervisor"
          />
          <input
            type="number"
            id="driver"
            name="driver"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Driver"
          />
          <input
            type="number"
            id="stairs"
            name="stairs"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Stairs"
          />
          <input
            type="number"
            id="derdare"
            name="derdare"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Derdare"
          />
          <input
            type="number"
            id="night"
            name="night"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Night"
          />
          <input
            type="number"
            id="long_way"
            name="long_way"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Long Way"
          />
          <input
            type="number"
            id="carpenter"
            name="carpenter"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Carpenter"
          />

          <select name="time" class="form-control mb-3">
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Evening">Evening</option>
          </select>

          <input
            type="number"
            id="additional"
            name="additional"
            min="0"
            step="1"
            class="form-control mb-3"
            placeholder="Additional"
          />

          <div class="mb-3">
            <label class="mb-2">Total Expense</label>
            <input
              type="number"
              id="total"
              name="total"
              class="form-control"
              readonly
            />
          </div>

          <input type="date" name="date" class="form-control mb-4" />

          <button class="btn btn-primary w-100">Save Expense</button>
        </form>
      </div>
    </div>

    <script>
      function calculateTotal() {
        let labor = parseInt(document.getElementById("labor").value) || 0;
        let packers = parseInt(document.getElementById("packers").value) || 0;
        let supervisor =
          parseInt(document.getElementById("supervisor").value) || 0;
        let driver = parseInt(document.getElementById("driver").value) || 0;
        let stairs = parseInt(document.getElementById("stairs").value) || 0;
        let derdare = parseInt(document.getElementById("derdare").value) || 0;
        let night = parseInt(document.getElementById("night").value) || 0;
        let longWay = parseInt(document.getElementById("long_way").value) || 0;
        let carpenter =
          parseInt(document.getElementById("carpenter").value) || 0;
        let additional =
          parseInt(document.getElementById("additional").value) || 0;

        let total =
          labor +
          packers +
          supervisor +
          driver +
          stairs +
          derdare +
          night +
          longWay +
          carpenter +
          additional;

        document.getElementById("total").value = total;
      }

      let inputs = document.querySelectorAll("input");
      inputs.forEach((input) => {
        input.addEventListener("input", calculateTotal);
      });
    </script>
  </body>
</html>
