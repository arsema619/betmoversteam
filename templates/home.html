{% load static %}

<!doctype html>
<html>
  <head>
    <title>BetMovers Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f7fb;
        font-family: Arial;
      }

      .login-box {
        width: 450px;
        margin: 80px auto;
        background: white;
        padding: 45px;
        border-radius: 25px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .logo {
        width: 120px;
        margin-bottom: 20px;
      }

      h2 {
        font-weight: bold;
        margin-bottom: 30px;
      }

      input,
      select {
        height: 55px !important;
        border-radius: 12px !important;
        margin-bottom: 20px;
      }

      button {
        height: 55px;
        width: 100%;
        border: none;
        border-radius: 12px;
        background: #2563eb;
        color: white;
        font-size: 18px;
        font-weight: bold;
      }

      button:hover {
        background: #1d4ed8;
      }

      .error {
        color: red;
        margin-bottom: 15px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <img src="{% static 'images/logo.png' %}" class="logo" />

      <h2>BetMovers Login</h2>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login/">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required />

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <select name="role">
          <option value="employee">Employee</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
